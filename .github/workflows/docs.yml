name: Docs Pages

on:
  push:
    branches: [docs/project-guide]
  pull_request:
    branches: [docs/project-guide]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate documentation and inventory
        run: python3 scripts/docs.py check
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD -- README.md CONTRIBUTING.md .gitignore .github docs scripts site
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix site ci
      - name: Validate API contract and build
        run: |
          npm --prefix site audit --audit-level=high
          npm --prefix site run check:api
          npm --prefix site run build

  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p 'test_archive_*.py'
      - run: python3 scripts/archive_verify.py

  check:
    name: check
    if: always()
    needs: [archive, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require archive and documentation validation
        env:
          ARCHIVE_RESULT: ${{ needs.archive.result }}
          DOCS_RESULT: ${{ needs.documentation.result }}
        run: test "$ARCHIVE_RESULT" = success && test "$DOCS_RESULT" = success
